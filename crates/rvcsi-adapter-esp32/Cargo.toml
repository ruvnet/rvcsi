[dependencies]
rvcsi-core = { path = "../rvcsi-core", version = "0.4.1" }
serde = { workspace = true }
serde_json = { workspace = true }
serialport = { version = "4.7", default-features = false }

[dev-dependencies]
socket2 = "0.6"
