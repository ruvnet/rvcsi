[workspace]
resolver = "2"
members = [
    "crates/rvcsi-core",
    "crates/rvcsi-dsp",
    "crates/rvcsi-events",
    "crates/rvcsi-adapter-file",
    "crates/rvcsi-adapter-nexmon",
    "crates/rvcsi-ruvector",
    "crates/rvcsi-runtime",
    "crates/rvcsi-node",
    "crates/rvcsi-cli",
]

[workspace.package]
version = "0.3.1"
edition = "2021"
authors = ["rUv <ruv@ruv.net>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/ruvnet/rvcsi"
homepage = "https://github.com/ruvnet/rvcsi"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
clap = { version = "4.4", features = ["derive", "env"] }
napi = { version = "2.16", default-features = false, features = ["napi8"] }
napi-derive = "2.16"
napi-build = "2.1"
cc = "1.0"

# Note: no `panic = "abort"` — `rvcsi-node` is a napi-rs cdylib and relies on
# unwinding to turn Rust panics into JS exceptions.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
